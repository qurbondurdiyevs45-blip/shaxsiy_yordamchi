<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Universe | Exclusive Project</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        /* Orqa fondagi harakatlanuvchi zarralar */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        /* Neon Sarlavha */
        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 40px var(--primary); }
            100% { opacity: 0.8; }
        }

        /* Terminal uslubidagi blok */
        .terminal {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            margin-top: 50px;
            backdrop-filter: blur(10px);
        }

        .terminal-header {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .typewriter {
            font-family: 'Courier New', Courier, monospace;
            color: #00ff41;
            font-size: 1.2rem;
        }

        /* Kartalar */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            background: var(--card-bg);
            border-bottom: 3px solid var(--primary);
            padding: 30px;
            transition: 0.4s;
            cursor: pointer;
            border-radius: 5px;
        }

        .card:hover {
            transform: translateY(-10px);
            background: var(--primary);
            color: black;
        }

        /* Interaktiv tugma */
        .magic-btn {
            margin-top: 40px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .magic-btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 50px var(--primary);
        }

    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <h1 id="title">FUTURE IT</h1>
        <p style="color: #888;">Ertangi kun texnologiyalari markazi</p>

        <div class="terminal">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="typewriter" id="typewriter-text"></div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Web Development</h3>
                <p>Zamonaviy va interaktiv saytlar qurish san'ati.</p>
            </div>
            <div class="card">
                <h3>Artificial Intelligence</h3>
                <p>Sun'iy intellekt va neyrotarmoqlar integratsiyasi.</p>
            </div>
            <div class="card">
                <h3>Creative Design</h3>
                <p>Mobilografiya va SMM uchun vizual kontentlar.</p>
            </div>
        </div>

        <button class="magic-btn" onclick="activateMatrix()">Matrix rejimini yoqish</button>
    </div>

    <script>
        // 1. Orqa fondagi zarrachalar animatsiyasi (Canvas)
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = '#00f2ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // 2. Typewriter effekti
        const text = "> Tizim yuklanmoqda...\n> Ma'lumotlar tahlil qilinmoqda...\n> Yangi avlod loyihasi tayyor!\n> Foydalanishga ruxsat berildi.";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter-text").innerHTML += text.charAt(i).replace('\n', '<br>');
                i++;
                setTimeout(typeWriter, 50);
            }
        }
        window.onload = typeWriter;

        // 3. Matrix Funksiyasi
        function activateMatrix() {
            alert("Matrix rejimi faollashdi! Ranglar o'zgarmoqda...");
            document.documentElement.style.setProperty('--primary', '#27c93f');
            document.getElementById('title').innerText = "SYSTEM CRACKED";
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
